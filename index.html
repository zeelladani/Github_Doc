<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DocVault</title>
<!-- PWA Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DocVault">

<!-- Stylesheet -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    DocVault
  </div>
  <div class="nav-actions">
    <button class="btn-primary" onclick="openUploadModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      Upload
    </button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">
      <h1>My Documents</h1>
      <p id="repoLine">Loading...</p>
    </div>
    <div id="expiryContainer"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="q" placeholder="Search files..." oninput="render()">
    </div>
    <div class="toolbar-actions">
      <select id="sort" onchange="render()">
        <option value="date-desc">Newest First</option>
        <option value="date-asc">Oldest First</option>
        <option value="name">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="size-desc">Size (Largest)</option>
        <option value="size">Size (Smallest)</option>
      </select>
      <button class="btn btn-secondary" onclick="load()">Refresh</button>
    </div>
  </div>

  <div class="type-filters" id="typeNav"></div>

  <!-- File Grid -->
  <div id="groups"></div>
</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal" onclick="closeUploadModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>Upload Files</h3>
      <button onclick="closeUploadModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Select files</label>
        <input type="file" id="file" multiple onchange="handleFileSelect(event)" style="display:none;">
        <div class="custom-file-input" onclick="document.getElementById('file').click()" id="fileLabel">
          Click to browse files
        </div>
        <div class="dest" id="dest"></div>
      </div>
      
      <div class="form-group">
        <label>Conflict Handling</label>
        <select id="overwrite" class="form-select">
          <option value="overwrite">Overwrite existing files</option>
          <option value="reject">Reject if file exists</option>
        </select>
      </div>

      <div class="progress" id="progress"><div id="progressBar"></div></div>

      <button class="btn btn-primary" id="uploadBtn" onclick="upload()" style="width: 100%; margin-top: 10px;">
        Start Upload
      </button>
    </div>
  </div>
</div>

<!-- Viewer Modal -->
<div class="modal" id="viewerModal" onclick="closeViewerModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    
    <div class="modal-header">
      <h3 id="modalTitle">Viewing Document</h3>
      <a id="modalDownload" href="#" download style="padding: 6px 12px; font-size: 13px; text-decoration: none; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; font-weight: 500; flex-shrink: 0;">Download</a>
    </div>
    
    <div class="modal-body" id="modalBody">
      <!-- Content injected here -->
    </div>

    <div class="modal-footer" id="viewerFooter">
      <button id="prevBtn" onclick="navigateViewer(-1)" title="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <button class="close-btn" onclick="closeViewerModal()" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>

      <button id="nextBtn" onclick="navigateViewer(1)" title="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Scripts -->
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
